# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        path: Preagonal.Scripting.GS2Compiler
    - uses: actions/checkout@v7
      with:
        repository: Preagonal/Preagonal.Scripting.GSAst
        path: Preagonal.Scripting.GSAst
        token: ${{ secrets.PREAGONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      working-directory: Preagonal.Scripting.GS2Compiler
      run: dotnet restore
    - name: Build
      working-directory: Preagonal.Scripting.GS2Compiler
      run: dotnet build --no-restore
    - name: Test
      working-directory: Preagonal.Scripting.GS2Compiler
      run: dotnet test --no-build --verbosity normal
